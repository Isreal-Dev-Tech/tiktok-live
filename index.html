<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; margin: 0; font-family: Arial, sans-serif; overflow-x: hidden; }
        .race-container { width: 100%; min-height: 100vh; background: #111; padding-top: 80px; }
        
        .lane { 
            height: 60px; 
            border-bottom: 1px dashed #444; 
            position: relative; 
            display: flex; 
            align-items: center;
            background: linear-gradient(90deg, #1a1a1a, #111);
        }

        .country-label {
            position: absolute;
            left: 10px;
            color: #555;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            z-index: 1;
        }

        .runner { 
            position: absolute; 
            left: 0; 
            transition: left 0.6s cubic-bezier(0.25, 0.1, 0.25, 1); 
            font-size: 35px; 
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .leaderboard { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            background: rgba(0,0,0,0.9); 
            color: gold; 
            padding: 10px; 
            border-bottom: 2px solid gold; 
            z-index: 100;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
        }

        .finish-line {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 30px;
            background: repeating-conic-gradient(#fff 0 25%, #000 0 50%) 0 0/10px 10px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="leaderboard" class="leaderboard">
        <strong>TOP 3:</strong>
        <div id="top-three">Waiting for racers...</div>
    </div>
    
    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');
        const topThree = document.getElementById('top-three');

        // This function draws the race
        function renderRace(countries) {
            track.innerHTML = '';
            
            countries.forEach((c, index) => {
                let lane = document.createElement('div');
                lane.className = 'lane';
                
                // Keep progress within 0-90% so they don't run off screen
                let progress = Math.min(c.score, 90); 
                
                lane.innerHTML = `
                    <div class="country-label">${c.name}</div>
                    <div class="finish-line"></div>
                    <div class="runner" style="left: ${progress}%">
                        ${c.flag} 🏃
                    </div>
                `;
                track.appendChild(lane);
            });

            // Update Top 3 in the header
            const top = countries.slice(0, 3).map(c => `${c.flag} ${c.score}`).join(' | ');
            topThree.innerHTML = top;
        }

        socket.on('updateRace', (countries) => {
            renderRace(countries);
        });

        // Request initial state as soon as page loads
        socket.on('connect', () => {
            socket.emit('requestInitialData'); 
        });
    </script>
</body>
</html>
