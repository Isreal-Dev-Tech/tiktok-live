<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; margin: 0; font-family: sans-serif; overflow: hidden; color: white; }
        
        /* Fixed Podium Box at the top */
        .podium-container {
            display: flex;
            justify-content: space-around;
            background: #222;
            padding: 10px;
            border-bottom: 3px solid gold;
            height: 90px;
        }
        .podium-item { text-align: center; width: 30%; }
        .podium-rank { font-size: 14px; color: gold; font-weight: bold; }
        .podium-flag { font-size: 40px; margin: 2px 0; }
        .podium-laps { font-size: 16px; background: gold; color: #000; padding: 2px 8px; font-weight: bold; border-radius: 4px; display: inline-block; }

        /* Compact Race Track for 20 people */
        .race-container { width: 100%; height: calc(100vh - 115px); overflow-y: hidden; }
        .lane { 
            height: 40px; 
            border-bottom: 1px solid #222; 
            position: relative; 
            display: flex; 
            align-items: center; 
            background: #111;
        }
        
        .runner { 
            position: absolute; 
            display: flex; 
            align-items: center;
            transition: left 0.8s linear; 
        }
        
        /* Layout: Flag -> Man -> Gift Icon */
        .flag-tail { font-size: 22px; order: 1; margin-right: 5px; }
        .runner-img { width: 40px; order: 2; transform: scaleX(-1); }
        .gift-tag { font-size: 16px; order: 3; margin-left: 5px; }

        .finish-line {
            position: absolute;
            right: 50px;
            top: 0; bottom: 0; width: 8px;
            background: repeating-linear-gradient(0deg, #fff, #fff 5px, #000 5px, #000 10px);
        }

        .side-n {
            position: absolute;
            right: 0; width: 50px; height: 100%;
            background: #333; color: gold;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }

        /* Speed Boost Effect */
        .boosting { filter: drop-shadow(0 0 10px #fff) brightness(1.3); }
    </style>
</head>
<body>

    <div class="podium-container">
        <div class="podium-item" id="p1">
            <div class="podium-rank">1ST</div>
            <div class="podium-flag">🏁</div>
            <div class="podium-laps">0</div>
        </div>
        <div class="podium-item" id="p2">
            <div class="podium-rank">2ND</div>
            <div class="podium-flag">🏁</div>
            <div class="podium-laps">0</div>
        </div>
        <div class="podium-item" id="p3">
            <div class="podium-rank">3RD</div>
            <div class="podium-flag">🏁</div>
            <div class="podium-laps">0</div>
        </div>
    </div>

    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');

        socket.on('updateRace', (data) => {
            const countries = data.allCountries || [];
            
            // 1. Update the Podium Box at the top
            if (data.winner) updatePodium('p1', data.winner);
            if (data.second) updatePodium('p2', data.second);
            if (data.third) updatePodium('p3', data.third);

            // 2. Clear and rebuild the 20 lanes
            track.innerHTML = '';
            countries.slice(0, 20).forEach((c) => {
                const isBoosting = data.lastGiftedId === c.id;
                let lane = document.createElement('div');
                lane.className = 'lane';
                lane.innerHTML = `
                    <div class="finish-line"></div>
                    <div class="runner" style="left: ${c.currentPos || 0}%">
                        <div class="flag-tail">${c.flag}</div>
                        <img src="/assets/fast.gif" class="runner-img ${isBoosting ? 'boosting' : ''}">
                        <div class="gift-tag">${c.giftIcon}</div>
                    </div>
                    <div class="side-n">${c.laps || 0}</div>
                `;
                track.appendChild(lane);
            });
        });

        function updatePodium(id, country) {
            const el = document.getElementById(id);
            if (!el || !country) return;
            el.querySelector('.podium-flag').innerText = country.flag;
            el.querySelector('.podium-laps').innerText = country.laps;
        }
    </script>
</body>
</html>
