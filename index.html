<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; color: white; }
        
        /* Top Leaderboard Podium */
        .podium-container {
            display: flex; justify-content: space-around;
            background: #111; padding: 10px; border-bottom: 4px solid #2ecc71; height: 90px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .podium-item { text-align: center; width: 30%; }
        .podium-rank { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
        .podium-flag { font-size: 38px; margin-bottom: 5px; }
        .podium-laps { font-size: 14px; background: #2ecc71; color: #000; padding: 2px 10px; font-weight: bold; border-radius: 20px; display: inline-block; }

        /* Race Track Styling */
        .race-container { width: 100%; height: calc(100vh - 115px); overflow: hidden; }
        .lane { 
            height: 45px; 
            position: relative; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s ease; /* Smooth lane swapping */
        }
        
        /* Alternating Green Turf */
        .lane:nth-child(odd) { background: #27ae60; }
        .lane:nth-child(even) { background: #2ecc71; }

        /* Fixed Starting Gift */
        .start-gift {
            position: absolute; left: 10px; font-size: 20px; 
            z-index: 10; opacity: 0.8;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }

        .runner { 
            position: absolute; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            transition: left 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 5;
        }
        
        .runner-content { display: flex; align-items: center; }
        .flag-tail { font-size: 20px; margin-right: 5px; }
        .runner-img { width: 45px; transform: scaleX(-1); }
        
        /* Country Name Overlay under the runner */
        .country-name {
            font-size: 10px; font-weight: bold; text-transform: uppercase;
            background: rgba(0,0,0,0.6); padding: 1px 6px; border-radius: 4px;
            margin-top: -5px; white-space: nowrap;
        }

        .finish-line {
            position: absolute; right: 0; top: 0; bottom: 0; width: 15px;
            background: repeating-linear-gradient(0deg, #fff, #fff 5px, #000 5px, #000 10px);
            box-shadow: -2px 0 5px rgba(0,0,0,0.3);
        }

        /* Projectile Gift Animation */
        .gift-flying {
            position: absolute; font-size: 22px; z-index: 100;
            transition: all 0.5s ease-in; pointer-events: none;
        }

        .boosting { filter: brightness(1.5) drop-shadow(0 0 10px white); transform: scale(1.2) scaleX(-1) !important; }
    </style>
</head>
<body>

    <div class="podium-container">
        <div class="podium-item" id="p1"><div class="podium-rank" style="color:gold">1ST PLACE</div><div class="podium-flag">🏁</div><div class="podium-laps">0</div></div>
        <div class="podium-item" id="p2"><div class="podium-rank" style="color:#eee">2ND PLACE</div><div class="podium-flag">🏁</div><div class="podium-laps">0</div></div>
        <div class="podium-item" id="p3"><div class="podium-rank" style="color:#cd7f32">3RD PLACE</div><div class="podium-flag">🏁</div><div class="podium-laps">0</div></div>
    </div>

    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');

        socket.on('updateRace', (data) => {
            const countries = data.allCountries || [];
            
            // 1. Update Podium
            if (data.winner) updatePodium('p1', data.winner);
            if (data.second) updatePodium('p2', data.second);
            if (data.third) updatePodium('p3', data.third);

            // 2. Build Tracks (Auto-sorts by rank)
            track.innerHTML = '';
            countries.slice(0, 20).forEach((c) => {
                const isGifting = data.lastGiftedId === c.id;
                let lane = document.createElement('div');
                lane.className = 'lane';
                lane.id = `lane-${c.id}`;
                
                lane.innerHTML = `
                    <div class="start-gift">${c.giftIcon}</div>
                    <div class="finish-line"></div>
                    <div class="runner" style="left: calc(${c.currentPos}% + 40px)" id="runner-${c.id}">
                        <div class="runner-content">
                            <div class="flag-tail">${c.flag}</div>
                            <img src="/assets/fast.gif" class="runner-img ${isGifting ? 'boosting' : ''}">
                        </div>
                        <div class="country-name">${c.name}</div>
                    </div>
                `;
                track.appendChild(lane);

                // If this country was just gifted, fly the gift!
                if (isGifting) {
                    flyGift(c.id, c.giftIcon);
                }
            });
        });

        function flyGift(id, icon) {
            const lane = document.getElementById(`lane-${id}`);
            const runner = document.getElementById(`runner-${id}`);
            if (!lane || !runner) return;

            const projectile = document.createElement('div');
            projectile.className = 'gift-flying';
            projectile.innerText = icon;
            projectile.style.left = "15px"; 
            projectile.style.top = "10px";
            lane.appendChild(projectile);

            // Animate to runner position
            setTimeout(() => {
                projectile.style.left = runner.style.left;
                setTimeout(() => {
                    projectile.remove(); // Remove on impact
                }, 500);
            }, 50);
        }

        function updatePodium(id, country) {
            const el = document.getElementById(id);
            if (!el) return;
            el.querySelector('.podium-flag').innerText = country.flag;
            el.querySelector('.podium-laps').innerText = `Laps: ${country.laps}`;
        }
    </script>
</body>
</html>
