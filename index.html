<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Football Race</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }

        /* ========================= PITCH CONTAINER ========================== */
        .race-container { width: 100%; height: 100vh; overflow: hidden; position: relative; }
        
        .lane {
            position: absolute; 
            width: 100%; height: 60px; overflow: hidden;
            transition: top 0.5s ease-in-out; 
            left: 0;
            display: flex;
            align-items: center;
        }

        /* Alternating Football Pitch Green */
        .lane:nth-child(odd) { background: #1b4d1b; } /* Dark Green */
        .lane:nth-child(even) { background: #2d702d; } /* Bright Green */

        /* White Bottom Line - Endless Rotation */
        .lane::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 3px;
            background-image: linear-gradient(to right, white 50%, transparent 50%);
            background-size: 80px 100%;
            animation: lineMove 3s linear infinite;
        }

        @keyframes lineMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }

        /* Bold Bright News Ticker (Country Names Only) */
        .news-ticker {
            position: absolute; width: 200%; white-space: nowrap;
            font-size: 32px; font-weight: 900; 
            color: #00ff00; /* Pure Bright Green/Neon */
            text-transform: uppercase;
            animation: tickerMove 15s linear infinite;
            z-index: 1;
            opacity: 0.3;
            pointer-events: none;
        }
        @keyframes tickerMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .start-gift { position: absolute; left: 12px; top: 15px; font-size: 30px; z-index: 10; filter: drop-shadow(0 0 5px black); }

        /* ========================= PLAYER / RUNNER ========================== */
        .runner {
            position: absolute; top: 5px; display: flex; align-items: center;
            transition: left 0.8s cubic-bezier(0.15,0.88,0.3,1); 
            z-index: 5;
        }
        .flag-tail { font-size: 28px; margin-right: 10px; filter: drop-shadow(0 0 5px black); }
        .runner-img { width: 55px; transform: scaleX(-1); }
        
        /* Pulse effect when gifting */
        .boosting { filter: brightness(1.5) drop-shadow(0 0 15px #ffffff); transform: scale(1.1) scaleX(-1); }

        /* GOAL NET FINISH LINE */
        .finish-line {
            position: absolute; right: 0; top: 0; bottom: 0; width: 45px;
            background-color: rgba(255, 255, 255, 0.1);
            background-image: 
                linear-gradient(white 1px, transparent 1px),
                linear-gradient(90deg, white 1px, transparent 1px);
            background-size: 10px 10px; /* Net Pattern */
            border-left: 4px solid white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            z-index: 6;
        }

        .live-score {
            position:absolute; right:60px; top:18px; z-index:20;
            font-weight:bold; font-size:22px; color:#fff;
            background: rgba(0,0,0,0.5);
            padding: 2px 10px;
            border-radius: 5px;
            text-shadow: 2px 2px 4px #000;
        }

        .gift-flying { position: absolute; font-size: 30px; z-index: 100; transition: all 0.5s ease-in; }
    </style>
</head>
<body>

    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');

        socket.on('updateRace', (data) => {
            const countries = data.allCountries || [];

            countries.slice(0, 20).forEach((c, index) => {
                let lane = document.getElementById(`lane-${c.id}`);
                const isGifting = data.lastGiftedId === c.id;

                if (!lane) {
                    lane = document.createElement('div');
                    lane.className = 'lane';
                    lane.id = `lane-${c.id}`;
                    track.appendChild(lane);
                }

                lane.style.top = `${index * 60}px`;

                // Ticker shows country name in bold bright color
                lane.innerHTML = `
                    <div class="news-ticker">
                        ${c.name} &nbsp;&nbsp; • &nbsp;&nbsp; ${c.name} &nbsp;&nbsp; • &nbsp;&nbsp; ${c.name} &nbsp;&nbsp; • &nbsp;&nbsp; ${c.name}
                    </div>
                    <div class="start-gift">${c.giftIcon}</div>
                    <div class="finish-line"></div>
                    <div class="live-score">${c.score}</div>
                    <div class="runner" id="runner-${c.id}" style="left: calc(${c.currentPos}% + 45px)">
                        <div class="flag-tail">${c.flag}</div>
                        <img src="/assets/fast.gif" class="runner-img ${isGifting ? 'boosting' : ''}">
                    </div>
                `;

                if (isGifting) {
                    flyGift(c.id, c.giftIcon);
                }
            });
        });

        function flyGift(id, icon) {
            const lane = document.getElementById(`lane-${id}`);
            const runner = document.getElementById(`runner-${id}`);
            if (!lane || !runner) return;

            const projectile = document.createElement('div');
            projectile.className = 'gift-flying';
            projectile.innerText = icon;
            projectile.style.left = '20px';
            projectile.style.top = '15px';
            lane.appendChild(projectile);

            requestAnimationFrame(() => {
                projectile.style.left = runner.style.left;
                setTimeout(() => { projectile.remove(); }, 500);
            });
        }
    </script>
</body>
</html>
