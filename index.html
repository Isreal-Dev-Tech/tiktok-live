<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #050505; margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; color: white; }
        
        /* Premium Broadcasting Header */
        .podium-container {
            display: flex; justify-content: space-around;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            padding: 10px; border-bottom: 3px solid #4834d4; height: 95px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .podium-item { text-align: center; width: 30%; position: relative; }
        .podium-rank { font-size: 11px; letter-spacing: 2px; font-weight: bold; color: #70a1ff; margin-bottom: 2px; text-transform: uppercase; }
        .podium-flag { font-size: 38px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); height: 45px; }
        .podium-laps { font-size: 13px; background: #4834d4; color: #fff; padding: 2px 12px; font-weight: bold; border-radius: 50px; display: inline-block; box-shadow: 0 0 10px #4834d4; margin-top: 5px; }

        /* Neon Racing Tracks */
        .race-container { width: 100%; height: calc(100vh - 115px); overflow: hidden; }
        .lane { 
            height: 52px; position: relative; display: flex; align-items: center; 
            border-bottom: 1px solid rgba(72, 52, 212, 0.2);
            overflow: hidden;
            transition: all 0.5s ease;
        }
        
        /* Midnight & Cyber-Gradient Tracks */
        .lane:nth-child(odd) { background: linear-gradient(90deg, #0f0c29, #302b63, #24243e); }
        .lane:nth-child(even) { background: linear-gradient(90deg, #200122, #400000); }

        /* NEWS TICKER STYLE NAME */
        .news-ticker {
            position: absolute; width: 200%; white-space: nowrap;
            font-size: 26px; font-weight: 900; font-style: italic;
            color: rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            animation: tickerMove 12s linear infinite;
            z-index: 1; pointer-events: none;
            user-select: none;
        }
        @keyframes tickerMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .start-gift {
            position: absolute; left: 12px; font-size: 26px; 
            z-index: 10; filter: drop-shadow(0 0 8px gold);
        }

        .runner { 
            position: absolute; display: flex; align-items: center;
            transition: left 0.8s cubic-bezier(0.15, 0.88, 0.3, 1);
            z-index: 5;
        }
        
        .flag-tail { font-size: 26px; margin-right: 8px; filter: drop-shadow(2px 2px 4px black); }
        .runner-img { width: 50px; transform: scaleX(-1); }

        .finish-line {
            position: absolute; right: 0; top: 0; bottom: 0; width: 20px;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, #000 10px, #000 20px);
            border-left: 2px solid #70a1ff;
            box-shadow: -5px 0 15px rgba(112, 161, 255, 0.4);
        }

        /* Projectile */
        .gift-flying {
            position: absolute; font-size: 26px; z-index: 100;
            transition: all 0.5s ease-in; filter: drop-shadow(0 0 12px white);
        }

        .boosting { 
            filter: brightness(1.8) drop-shadow(0 0 15px #70a1ff) !important; 
            transform: scale(1.2) scaleX(-1) !important; 
        }
    </style>
</head>
<body>

    <div class="podium-container">
        <div class="podium-item" id="p1">
            <div class="podium-rank">1ST PLACE</div>
            <div class="podium-flag">🏆</div>
            <div class="podium-laps">---</div>
        </div>
        <div class="podium-item" id="p2">
            <div class="podium-rank">2ND PLACE</div>
            <div class="podium-flag">🏆</div>
            <div class="podium-laps">---</div>
        </div>
        <div class="podium-item" id="p3">
            <div class="podium-rank">3RD PLACE</div>
            <div class="podium-flag">🏆</div>
            <div class="podium-laps">---</div>
        </div>
    </div>

    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');

        socket.on('updateRace', (data) => {
            const countries = data.allCountries || [];
            
            // Fix Undefined by checking if country exists
            updatePodium('p1', data.winner);
            updatePodium('p2', data.second);
            updatePodium('p3', data.third);

            track.innerHTML = '';
            countries.slice(0, 20).forEach((c) => {
                const isGifting = data.lastGiftedId === c.id;
                let lane = document.createElement('div');
                lane.className = 'lane';
                lane.id = `lane-${c.id}`;
                
                lane.innerHTML = `
                    <div class="news-ticker">${c.name} &nbsp;&nbsp; • &nbsp;&nbsp; ${c.name} &nbsp;&nbsp; • &nbsp;&nbsp; ${c.name}</div>
                    <div class="start-gift">${c.giftIcon}</div>
                    <div class="finish-line"></div>
                    <div class="runner" style="left: calc(${c.currentPos}% + 45px)" id="runner-${c.id}">
                        <div class="flag-tail">${c.flag}</div>
                        <img src="/assets/fast.gif" class="runner-img ${isGifting ? 'boosting' : ''}">
                    </div>
                `;
                track.appendChild(lane);

                if (isGifting) {
                    flyGift(c.id, c.giftIcon);
                }
            });
        });

        function flyGift(id, icon) {
            const lane = document.getElementById(`lane-${id}`);
            const runner = document.getElementById(`runner-${id}`);
            if (!lane || !runner) return;

            const projectile = document.createElement('div');
            projectile.className = 'gift-flying';
            projectile.innerText = icon;
            projectile.style.left = "20px"; 
            projectile.style.top = "12px";
            lane.appendChild(projectile);

            setTimeout(() => {
                projectile.style.left = runner.style.left;
                setTimeout(() => { projectile.remove(); }, 500);
            }, 50);
        }

        function updatePodium(id, country) {
            const el = document.getElementById(id);
            if (!el) return;
            
            const flagEl = el.querySelector('.podium-flag');
            const lapsEl = el.querySelector('.podium-laps');

            // If country exists and has score, show data. Else show placeholder.
            if (country && country.score > 0) {
                flagEl.innerText = country.flag;
                lapsEl.innerText = `Laps: ${country.laps}`;
            } else {
                flagEl.innerText = "🏆";
                lapsEl.innerText = "---";
            }
        }
    </script>
</body>
</html>
