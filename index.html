<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Race - Professional Edition</title>
    <style>
        body { background: #050505; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }

        /* ========================= TOP LEADERBOARD ========================== */
        .podium-container {
            display: flex; justify-content: space-around; align-items: center;
            height: 100px; background: linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);
            border-bottom: 3px solid #4834d4; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .podium-item { width: 30%; text-align: center; }
        .podium-rank { font-size: 11px; letter-spacing: 1px; font-weight: bold; color: #70a1ff; margin-bottom: 3px; text-transform: uppercase; }
        .podium-flag { font-size: 40px; height: 45px; transition: all 0.3s ease; }
        .podium-laps {
            display: inline-block; margin-top: 5px; background: #4834d4;
            padding: 3px 14px; border-radius: 50px; font-size: 13px;
            font-weight: bold; box-shadow: 0 0 12px #4834d4;
        }

        /* ========================= RACE TRACK ========================== */
        .race-container { width: 100%; height: calc(100vh - 100px); overflow: hidden; position: relative; }
        
        .lane {
            position: absolute; 
            width: 100%; height: 52px; overflow: hidden;
            border-bottom: 1px solid rgba(72,52,212,0.2);
            transition: top 0.5s ease-in-out; 
            left: 0;
        }
        .lane:nth-child(odd) { background: linear-gradient(90deg,#0f0c29,#302b63,#24243e); }
        .lane:nth-child(even) { background: linear-gradient(90deg,#200122,#400000); }

        .news-ticker {
            position: absolute; width: 200%; white-space: nowrap;
            font-size: 26px; font-weight: 900; font-style: italic;
            color: rgba(255,255,255,0.05); text-transform: uppercase;
            animation: tickerMove 12s linear infinite; z-index: 1;
        }
        @keyframes tickerMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .sender-name { color: #70a1ff; font-weight: bold; }
        .ticker-boost { color: #00ff88; text-shadow: 0 0 10px #00ff88; }
        .start-gift { position: absolute; left: 12px; top: 10px; font-size: 26px; z-index: 10; }

        /* ========================= RUNNER ========================== */
        .runner {
            position: absolute; top: 5px; display: flex; align-items: center;
            transition: left 0.8s cubic-bezier(0.15,0.88,0.3,1); 
            z-index: 5;
        }
        .flag-tail { font-size: 26px; margin-right: 8px; }
        .runner-img { width: 50px; transform: scaleX(-1); }
        .boosting { filter: brightness(1.8) drop-shadow(0 0 15px #70a1ff); transform: scale(1.2) scaleX(-1); }

        .finish-line {
            position: absolute; right: 0; top: 0; bottom: 0; width: 20px;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, #000 10px, #000 20px);
            border-left: 2px solid #70a1ff;
        }

        .live-score {
            position:absolute; right:35px; top:12px; z-index:20;
            font-weight:bold; font-size:18px; color:#00ff88;
            text-shadow:0 0 10px #00ff88;
        }

        .gift-flying { position: absolute; font-size: 26px; z-index: 100; transition: all 0.5s ease-in; }
    </style>
</head>
<body>

    <div class="podium-container">
        <div class="podium-item" id="p1">
            <div class="podium-rank">1ST PLACE</div>
            <div class="podium-flag">🏆</div>
            <div class="podium-laps">0 Wins</div>
        </div>
        <div class="podium-item" id="p2">
            <div class="podium-rank">2ND PLACE</div>
            <div class="podium-flag">🏆</div>
            <div class="podium-laps">0 Wins</div>
        </div>
        <div class="podium-item" id="p3">
            <div class="podium-rank">3RD PLACE</div>
            <div class="podium-flag">🏆</div>
            <div class="podium-laps">0 Wins</div>
        </div>
    </div>

    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');

        socket.on('updateRace', (data) => {
            const countries = data.allCountries || [];

            // Update the top Ranks (1st, 2nd, 3rd)
            updatePodium('p1', data.winner, "1ST PLACE");
            updatePodium('p2', data.second, "2ND PLACE");
            updatePodium('p3', data.third, "3RD PLACE");

            // Update Lanes
            countries.slice(0, 20).forEach((c, index) => {
                let lane = document.getElementById(`lane-${c.id}`);
                const isGifting = data.lastGiftedId === c.id;

                // Create lane if it doesn't exist
                if (!lane) {
                    lane = document.createElement('div');
                    lane.className = 'lane';
                    lane.id = `lane-${c.id}`;
                    track.appendChild(lane);
                }

                // Smooth lane sorting
                lane.style.top = `${index * 52}px`;

                const boostText = isGifting ? 
                    `<span class="sender-name">${data.senderName}</span> <span class="ticker-boost">+${data.lastGiftAmount}x ${c.giftIcon}</span>` : '';
                
                // Update internal lane content
                lane.innerHTML = `
                    <div class="news-ticker">
                        ${c.name} ${boostText} &nbsp;&nbsp; • &nbsp;&nbsp; ${c.name} ${boostText}
                    </div>
                    <div class="start-gift">${c.giftIcon}</div>
                    <div class="finish-line"></div>
                    <div class="live-score">${c.score}</div>
                    <div class="runner" id="runner-${c.id}" style="left: calc(${c.currentPos}% + 45px)">
                        <div class="flag-tail">${c.flag}</div>
                        <img src="/assets/fast.gif" class="runner-img ${isGifting ? 'boosting' : ''}">
                    </div>
                `;

                if (isGifting) {
                    flyGift(c.id, c.giftIcon);
                }
            });
        });

        function flyGift(id, icon) {
            const lane = document.getElementById(`lane-${id}`);
            const runner = document.getElementById(`runner-${id}`);
            if (!lane || !runner) return;

            const projectile = document.createElement('div');
            projectile.className = 'gift-flying';
            projectile.innerText = icon;
            projectile.style.left = '20px';
            projectile.style.top = '12px';
            lane.appendChild(projectile);

            requestAnimationFrame(() => {
                projectile.style.left = runner.style.left;
                setTimeout(() => { projectile.remove(); }, 500);
            });
        }

        // ==========================================
        // PODIUM UPDATE LOGIC (Fixed for Ranks)
        // ==========================================
        function updatePodium(id, player, defaultRankLabel) {
            const el = document.getElementById(id);
            if (!el) return;

            const rankEl = el.querySelector('.podium-rank');
            const flagEl = el.querySelector('.podium-flag');
            const lapsEl = el.querySelector('.podium-laps');

            if (player && player.wins > 0) {
                // Shows "NIGERIA - 1ST PLACE"
                rankEl.innerText = `${player.name} - ${defaultRankLabel}`;
                flagEl.innerText = player.flag;
                lapsEl.innerText = `${player.wins} Wins`;
            } else {
                // Resets if no one has won yet
                rankEl.innerText = defaultRankLabel;
                flagEl.innerText = "🏆";
                lapsEl.innerText = "0 Wins";
            }
        }
    </script>
</body>
</html>
