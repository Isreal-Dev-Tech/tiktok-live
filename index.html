<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; margin: 0; font-family: sans-serif; color: white; }
        .leaderboard { position: fixed; top: 0; width: 100%; background: gold; color: black; padding: 10px; font-weight: bold; text-align: center; z-index: 10; }
        .race-track { padding-top: 50px; background: #111; min-height: 100vh; }
        .lane { height: 45px; border-bottom: 1px solid #333; position: relative; display: flex; align-items: center; }
        .name-tag { position: absolute; left: 5px; font-size: 10px; color: #666; z-index: 1; }
        .runner { position: absolute; left: 0; transition: left 0.5s linear; font-size: 25px; z-index: 2; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="leaderboard" id="top-info">WAITING FOR TIKTOK...</div>
    <div class="race-track" id="track"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('track');
        const info = document.getElementById('top-info');

        socket.on('updateRace', (countries) => {
            track.innerHTML = ''; 
            countries.forEach((c) => {
                let lane = document.createElement('div');
                lane.className = 'lane';
                // Calculate position (max 90%)
                let pos = Math.min(c.score, 90);
                lane.innerHTML = `
                    <div class="name-tag">${c.name}</div>
                    <div class="runner" style="left: ${pos}%">${c.flag} 🏃</div>
                `;
                track.appendChild(lane);
            });
            
            if(countries.length > 0) {
                info.innerHTML = `TOP: ${countries.flag} ${countries.name} (${countries.score})`;
            }
        });
    </script>
</body>
</html>
