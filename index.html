<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; margin: 0; font-family: 'Arial', sans-serif; overflow: hidden; color: white; }
        
        .winner-section {
            width: 100%;
            height: 150px;
            background: #222;
            border: 4px solid gold;
            display: flex;
            position: relative;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .winner-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            z-index: 10;
        }
        .lap-counter {
            width: 80px;
            background: gold;
            color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-left: 4px solid gold;
            z-index: 10;
        }
        .lap-counter .n-value { font-size: 30px; }

        .race-container { width: 100%; background: #111; }
        .lane { 
            height: 65px; 
            border-bottom: 2px solid #333; 
            position: relative; 
            display: flex; 
            align-items: center; 
        }
        .side-n {
            position: absolute;
            right: 0;
            width: 40px;
            height: 100%;
            background: #333;
            color: gold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 5;
        }
        .runner { 
            position: absolute; 
            left: 0; 
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 2;
        }
        .runner img { width: 55px; transform: scaleX(-1); }
        .runner .flag-small { font-size: 18px; margin-top: -5px; font-weight: bold; }

        .gift-projectile {
            position: absolute;
            font-size: 24px;
            z-index: 100;
            pointer-events: none;
            transition: all 0.5s ease-in;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            font-size: 30px;
            opacity: 0.8;
            animation: floatUp 3s linear forwards;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            100% { transform: translateY(-200px) translateX(20px); opacity: 0; }
        }

        .finish-line {
            position: absolute;
            right: 40px;
            top: 0;
            bottom: 0;
            width: 5px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px);
        }
    </style>
</head>
<body>

    <div id="winner-box-ui" class="winner-section">
        <div class="winner-box" id="top-flag">🏁</div>
        <div class="lap-counter">
            <span>Laps (N)</span>
            <div class="n-value" id="top-n">0</div>
        </div>
    </div>

    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');
        const topFlag = document.getElementById('top-flag');
        const topN = document.getElementById('top-n');

        socket.on('updateRace', (data) => {
            // FIX: Correctly extract the array and the winner object
            const countries = data.allCountries || (Array.isArray(data) ? data : []);
            
            // If the server sends the winner as part of the object, use it; 
            // otherwise, grab the first item from the array.
            let winner = data.winner;
            if (!winner && countries.length > 0) {
                winner = countries;
            }
            
            if (!winner || countries.length === 0) return;

            // 1. UPDATE WINNER BOX (No more undefined)
            topFlag.innerHTML = `
                <div style="font-size:20px; color:gold;">${winner.giftIcon || ''} ${winner.gift || ''}</div>
                <img src="/assets/hurray.gif" style="width:70px;">
                <div style="font-size:40px; margin-top:-10px;">${winner.flag || ''} ${winner.name || ''}</div>
            `;
            topN.innerText = winner.laps || 0;

            if (data.lastGiftedId === winner.id) {
                createBubbles(winner.giftIcon);
            }

            // 2. UPDATE RACE TRACK (Lanes)
            track.innerHTML = '';
            // We show all countries in the race lanes
            countries.forEach((c, index) => {
                let lane = document.createElement('div');
                lane.className = 'lane';
                
                // Top 3 get the 'fast' gif
                let gifType = (index <= 2) ? 'fast.gif' : 'slow.gif';
                
                lane.innerHTML = `
                    <div class="finish-line"></div>
                    <div class="runner" style="left: ${c.currentPos || 0}%" id="runner-${c.id}">
                        <img src="/assets/${gifType}">
                        <div class="flag-small">${c.flag || ''} ${c.name || ''}</div>
                    </div>
                    <div class="side-n">${c.laps || 0}</div>
                `;
                track.appendChild(lane);

                // Trigger projectile hit if this country was just gifted
                if (data.lastGiftedId === c.id) {
                    triggerHit(c.id, data.lastGiftIcon || c.giftIcon);
                }
            });
        });

        function triggerHit(countryId, icon) {
            const runner = document.getElementById(`runner-${countryId}`);
            if (!runner) return;

            const projectile = document.createElement('div');
            projectile.className = 'gift-projectile';
            projectile.innerText = icon;
            projectile.style.left = "-20px";
            projectile.style.top = "10px";
            
            runner.parentElement.appendChild(projectile);

            setTimeout(() => {
                projectile.style.left = runner.style.left;
                runner.style.transform = "scale(1.2)";
                setTimeout(() => { 
                    runner.style.transform = "scale(1)"; 
                    projectile.remove();
                }, 300);
            }, 50);
        }

        function createBubbles(icon) {
            for(let i=0; i<5; i++) {
                const b = document.createElement('div');
                b.className = 'bubble';
                b.innerText = icon;
                b.style.left = Math.random() * 80 + 10 + "%";
                document.getElementById('winner-box-ui').appendChild(b);
                setTimeout(() => b.remove(), 3000);
            }
        }
    </script>
</body>
</html>
